<!DOCTYPE html>
<html lang="en">

<head>
    <title>Abhinav's Current Affairs</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <style>
         :root {
            --bg-color: #F5F5F5;
            --surface-color: #FFFFFF;
            --primary-text: #333333;
            --secondary-text: #666666;
            --accent-color: #007BFF;
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Roboto', sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            background-color: var(--bg-color);
            font-family: var(--font-body);
            color: var(--primary-text);
            line-height: 1.6;
        }
        
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: #1A237E;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-brand {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            color: white;
            text-decoration: none;
        }
        
        .nav-links {
            display: flex;
            list-style: none;
        }
        
        .nav-links li {
            margin-left: 2rem;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .nav-links a:hover {
            color: #FFEB3B;
        }
        
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        section {
            margin-bottom: 4rem;
        }
        
        .section-title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }
        
        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background-color: #1A237E;
            margin: 0.5rem auto 0;
            border-radius: 2px;
        }
        
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .news-card {
            background-color: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .news-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }
        
        .news-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .news-content {
            padding: 1.5rem;
            flex-grow: 1;
        }
        
        .news-content h3 a {
            font-family: var(--font-heading);
            margin-bottom: 0.5rem;
            color: var(--primary-text);
            text-decoration: none;
        }
        
        .news-content h3 a:hover {
            color: #1A237E;
        }
        
        .news-source {
            display: block;
            color: var(--accent-color);
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 0.5rem;
        }
        
        .news-summary {
            margin-top: 0.8rem;
            font-style: italic;
            color: var(--secondary-text);
        }
        
        footer {
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
            background-color: #DDDDDD;
        }
        
        footer p {
            color: var(--secondary-text);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <nav>
        <div class="nav-brand">Abhinav's News</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="Current Affairs.html">Current Affairs</a></li>
            <li><a href="Contact Me.html">Contact Me</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2 class="section-title">Current Affairs</h2>
            <div class="news-grid" id="news-cards-container">
                Loading news...
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Abhinav's News. Powered by GNews API.</p>
    </footer>

    <script>
        async function fetchCurrentAffairs() {
            const container = document.getElementById("news-cards-container");
            if (!container) return; // safety check
            container.textContent = "Loading news...";

            try {
                const res = await fetch("http://localhost:3000/api/news"); // call backend
                if (!res.ok) throw new Error("Network response was not ok");

                const articles = await res.json();

                if (!articles || articles.length === 0) {
                    container.textContent = "No news available.";
                    return;
                }

                container.innerHTML = "";

                articles.forEach(article => {
                    const card = document.createElement("div");
                    card.className = "news-card";
                    card.innerHTML = `
                <a href="${article.url}" target="_blank" rel="noopener noreferrer">
                    <img src="${article.urlToImage || 'https://picsum.photos/600/400'}" alt="${article.title}">
                </a>
                <div class="news-content">
                    <h3><a href="${article.url}" target="_blank" rel="noopener noreferrer">${article.title}</a></h3>
                    <span class="news-source">${article.source.name || 'Unknown'}</span>
                    <p class="news-summary">${article.description || ''}</p>
                </div>
            `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Error fetching news:", err);
                container.textContent = "Failed to load news.";
            }
        }

        // Initial fetch
        fetchCurrentAffairs();
        fetch("http://localhost:3000/api/news", {
            mode: 'cors'
        })

        // Refresh every hour
        setInterval(fetchCurrentAffairs, 60 * 60 * 1000);
    </script>

</body>

</html>
